name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: oracle
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.0'

      - name: Create Flutter Android project
        run: flutter create . --platforms=android

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --target=lib/main.dart --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamza-digital-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
