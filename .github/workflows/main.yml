name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'

      - name: Create Android project
        run: |
          mkdir /tmp/flutter_app
          flutter create /tmp/flutter_app --platforms=android --project-name hamza_s_kardam_digital_app
          cp -R /tmp/flutter_app/android ./android

      - name: Apply app branding
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp branding/kardam_launcher.xml android/app/src/main/res/drawable/kardam_launcher.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/kardam_launcher"#' android/app/src/main/AndroidManifest.xml

      - name: Fix Android NDK
        run: |
          sed -i 's/ndkVersion = flutter.ndkVersion/ndkVersion = "27.0.12077973"/' android/app/build.gradle.kts
          grep -n 'ndkVersion' android/app/build.gradle.kts

      - name: Check Android project
        run: |
          ls -la android
          if [ -f android/settings.gradle.kts ]; then
            echo "Found settings.gradle.kts"
          elif [ -f android/settings.gradle ]; then
            echo "Found settings.gradle"
          else
            echo "ERROR: No Android settings.gradle or settings.gradle.kts found"
            exit 1
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Repair and validate Dart source
        run: bash tool/repair_build_syntax.sh

      - name: Build optimized release APK
        run: flutter build apk --release --target=lib/main.dart --no-pub

      - name: Build Play Store App Bundle
        run: flutter build appbundle --release --target=lib/main.dart --no-pub

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hamza-digital-app-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab

# Release build: optimized for distribution; debug APKs are intentionally not used for final delivery.
