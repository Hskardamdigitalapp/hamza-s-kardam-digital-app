name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: oracle
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.29.3'

      - name: Create Android project
        run: |
          mkdir /tmp/flutter_app
          flutter create /tmp/flutter_app --platforms=android --project-name hamza_s_kardam_digital_app
          cp -R /tmp/flutter_app/android ./android

      - name: Check Android project
        run: |
          ls -la android
          echo "Checking Kotlin configuration..."
          if [ -f android/settings.gradle.kts ]; then
            echo "Found settings.gradle.kts"
            cat android/settings.gradle.kts
          elif [ -f android/settings.gradle ]; then
            echo "Found settings.gradle"
            cat android/settings.gradle
          else
            echo "ERROR: No Android settings.gradle or settings.gradle.kts found"
            exit 1
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --target=lib/main.dart --no-pub

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hamza-digital-app-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
